
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="TaskFlow - Organise your tasks, manage priorities and stay productive.">

    <link rel="stylesheet" href="todo.css">

    <title>TaskFlow | Personal Task Manager</title>
</head>

<body>

    <div class="app-shell">

        <!-- HEADER -->
        <header class="app-header">
            <div class="brand">
                <div class="brand-mark">T</div>

                <div>
                    <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
                    <h1>TaskFlow</h1>
                    <p class="header-subtitle">
                        Organise your work. Stay on track.
                    </p>
                </div>
            </div>
        </header>


        <main class="app-main">

            <!-- TASK STATISTICS -->
            <section class="stats-grid" aria-label="Task statistics">

                <article class="stat-card">
                    <span class="stat-label">Tasks Shown</span>
                    <p id="todo-counter">0</p>
                </article>

                <article class="stat-card">
                    <span class="stat-label">Completed</span>
                    <p id="completed-counter">0</p>
                </article>

                <article class="stat-card">
                    <span class="stat-label">Remaining</span>
                    <p id="uncompleted-counter">0</p>
                </article>

                <article class="stat-card">
                    <span class="stat-label">Total Tasks</span>
                    <p id="total-counter">0</p>
                </article>

            </section>


            <!-- ADD TASK -->
            <section class="panel composer">

                <div class="section-heading">
                    <div>
                        <p class="eyebrow">MAKE PROGRESS</p>
                        <h2>Create a new task</h2>
                    </div>
                </div>

                <div class="task-form-grid">

                    <label class="field task-title-field" for="todo-input">
                        Task description

                        <input
                            type="text"
                            id="todo-input"
                            placeholder="What needs to get done?"
                        >
                    </label>

                    <label class="field" for="due-date-input">
                        Due date

                        <input type="date" id="due-date-input">
                    </label>

                    <label class="field" for="priority">
                        Priority

                        <select id="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>Medium</option>
                            <option value="high">High</option>
                        </select>
                    </label>

                    <label class="field" for="category">
                        Category

                        <select id="category">
                            <option value="learning">Learning</option>
                            <option value="work">Work</option>
                            <option value="personal" selected>Personal</option>
                            <option value="projects">Projects</option>
                        </select>
                    </label>

                </div>

                <div class="form-actions">
                    <p>Keep your tasks organised and actionable.</p>

                    <button id="add-todo" class="primary-button" type="button">
                        + Add Task
                    </button>
                </div>

            </section>


            <!-- TASK CONTROLS -->
            <section class="panel controls-panel">

                <div class="controls-top">

                    <!-- SEARCH -->
                    <label class="field search-field" for="search-input">
                        Search tasks

                        <div class="search-control">
                            <input
                                type="text"
                                id="search-input"
                                placeholder="Search your tasks..."
                            >

                            <button id="search-todos" type="button">
                                Search
                            </button>
                        </div>
                    </label>


                    <!-- STATUS FILTER -->
                    <div class="field">
                        <span class="field-label">Task status</span>

                        <div id="filter-options">
                            <button id="filter-all" type="button">All</button>
                            <button id="filter-active" type="button">Active</button>
                            <button id="filter-completed" type="button">Completed</button>
                        </div>
                    </div>

                </div>


                <!-- CATEGORY AND SORTING -->
                <div class="select-controls">

                    <label class="field" for="category-filter">
                        Filter by category

                        <select id="category-filter">
                            <option value="all">All Categories</option>
                            <option value="learning">Learning</option>
                            <option value="work">Work</option>
                            <option value="personal">Personal</option>
                            <option value="projects">Projects</option>
                            <option value="uncategorized">Uncategorized</option>
                        </select>
                    </label>

                    <label class="field" for="sort-todos">
                        Sort tasks

                        <select id="sort-todos">
                            <option value="default">Default Order</option>
                            <option value="priority">Priority: High to Low</option>
                            <option value="due-asc">Due Date: Earliest First</option>
                            <option value="due-desc">Due Date: Latest First</option>
                        </select>
                    </label>

                </div>

            </section>


            <!-- TASK LIST -->
            <section class="panel task-panel">

                <div class="tasks-heading">

                    <div>
                        <p class="eyebrow">YOUR WORKSPACE</p>
                        <h2>Your Tasks</h2>
                    </div>

                    <button id="clear-completed" class="clear-button" type="button">
                        Clear Completed
                    </button>

                </div>

                <p id="empty-message" class="empty-message" aria-live="polite"></p>

                <ul id="todo-list"></ul>

            </section>

        </main>


        <!-- FOOTER -->
        <footer class="app-footer">
            <p>TaskFlow · Stay organised. Keep moving.</p>
        </footer>

    </div>

    <script src="todo.js"></script>

</body>
</html>
